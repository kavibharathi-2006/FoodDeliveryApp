
<!DOCTYPE html>
<html>
<head>
    <title>Food Delivery App</title>

    <style>
        body {
            font-family: Arial;
            background-color: #fff4ec;
            margin: 0;
        }

        header {
            background-color: rgb(40, 224, 47);
            color: white;
            text-align: center;
            padding: 15px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 20px auto;
        }

        .foods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .food, .cart {
            background-color: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        .food img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
        }

        button {
            background-color: rgb(32, 218, 53);
            color: white;
            border: none;
            padding: 10px;
            margin: 4px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkred;
        }

        input, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin: 7px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 70px;
            resize: vertical;
        }

        #cartItems p {
            border-bottom: 1px solid #ddd;
            padding: 8px;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Foodie</h1>
    <p>Delicious Food, Delivered!</p>
</header>

<div class="container">

    <div id="login" class="cart">
        <h2>Login</h2>
        <input id="username" placeholder="Enter your name">
        <button onclick="login()">Login</button>
    </div>

    <div id="app" class="hidden">

        <h2 id="welcome"></h2>

        <button onclick="logout()">Logout</button>

        <input id="search" placeholder="Search food..."
               oninput="showFoods()">

        <h2>Our Menu</h2>

        <div class="foods" id="foodList"></div>

        <div class="cart">
            <h2>Your Cart</h2>
            <div id="cartItems"></div>

            <p class="total">
                Total: ₹<span id="total">0</span>
            </p>

            <button onclick="clearCart()">Clear Cart</button>
        </div>

        <div class="cart">
            <h2>Delivery Address</h2>

            <input id="phone" type="tel"
                   placeholder="10-digit mobile number"
                   maxlength="10">

            <input id="door" placeholder="Door No. / Street Name">

            <input id="area" placeholder="Area / City">

            <input id="pincode" type="text"
                   placeholder="6-digit PIN code"
                   maxlength="6">

            <textarea id="instructions"
                      placeholder="Delivery instructions (optional)"></textarea>

            <h3>Payment Method</h3>

            <select id="payment"
                    style="width:100%;padding:10px;">
                <option value="Cash on Delivery">
                    Cash on Delivery
                </option>
                <option value="UPI (Demo)">
                    UPI (Demo)
                </option>
            </select>

            <br><br>

            <button onclick="orderFood()">Place Order</button>
        </div>

        <div id="orders">
            <h2>My Orders</h2>
            <p>No orders yet.</p>
        </div>

    </div>
</div>

<script>
var foods = [
    {
        name: "Pizza",
        price: 199,
        image: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400"
    },
    {
        name: "Burger",
        price: 149,
        image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400"
    },
    {
        name: "Fried Rice",
        price: 129,
        image: "https://images.unsplash.com/photo-1603133872878-684f208fb84b?w=400"
    },
    {
        name: "French Fries",
        price: 79,
        image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=400"
    },
    {
        name: "Sandwich",
        price: 99,
        image: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=400"
    },
    {
        name: "Pasta",
        price: 159,
        image: "https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=400"
    }
];

var cart = [];
var orders = [];
var customer = "";

function login() {
    var name = document.getElementById("username").value.trim();

    if (name === "") {
        alert("Please enter your name!");
        return;
    }

    customer = name;

    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    document.getElementById("welcome").textContent =
        "Welcome, " + customer + "!";

    showFoods();
    showCart();
}

function logout() {
    document.getElementById("app").classList.add("hidden");
    document.getElementById("login").classList.remove("hidden");

    document.getElementById("username").value = "";
    customer = "";
}

function showFoods() {
    var list = document.getElementById("foodList");
    var search = document.getElementById("search").value.toLowerCase();

    list.innerHTML = "";

    foods.forEach(function(food, index) {
        if (food.name.toLowerCase().includes(search)) {
            list.innerHTML += `
                <div class="food">
                    <img src="${food.image}" alt="${food.name}">
                    <h3>${food.name}</h3>
                    <p>Price: ₹${food.price}</p>
                    <button onclick="addCart(${index})">
                        Add to Cart
                    </button>
                </div>
            `;
        }
    });

    if (list.innerHTML === "") {
        list.innerHTML = "<p>No food found.</p>";
    }
}

function addCart(index) {
    var item = cart.find(function(food) {
        return food.name === foods[index].name;
    });

    if (item) {
        item.quantity++;
    } else {
        cart.push({
            name: foods[index].name,
            price: foods[index].price,
            quantity: 1
        });
    }

    showCart();
}

function showCart() {
    var list = document.getElementById("cartItems");
    var total = 0;

    list.innerHTML = "";

    cart.forEach(function(item, index) {
        total += item.price * item.quantity;

        list.innerHTML += `
            <p>
                <b>${item.name}</b> - ₹${item.price}
                <br>
                Quantity: ${item.quantity}
                <br>
                <button onclick="changeQty(${index}, 1)">+</button>
                <button onclick="changeQty(${index}, -1)">-</button>
                <button onclick="removeItem(${index})">Remove</button>
            </p>
        `;
    });

    if (cart.length === 0) {
        list.innerHTML = "<p>Your cart is empty.</p>";
    }

    document.getElementById("total").textContent = total;
}

function changeQty(index, amount) {
    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
    }

    showCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    showCart();
}

function clearCart() {
    cart = [];
    showCart();
}

function orderFood() {
    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    var phone = document.getElementById("phone").value.trim();
    var door = document.getElementById("door").value.trim();
    var area = document.getElementById("area").value.trim();
    var pincode = document.getElementById("pincode").value.trim();

    var instructions =
        document.getElementById("instructions").value.trim();

    var payment = document.getElementById("payment").value;

    if (!phone || !door || !area || !pincode) {
        alert("Please enter your full delivery address!");
        return;
    }

    if (!/^[0-9]{10}$/.test(phone)) {
        alert("Enter a valid 10-digit mobile number!");
        return;
    }

    if (!/^[0-9]{6}$/.test(pincode)) {
        alert("Enter a valid 6-digit PIN code!");
        return;
    }

    var total = 0;

    cart.forEach(function(item) {
        total += item.price * item.quantity;
    });

    orders.push({
        customer: customer,
        items: cart.map(function(item) {
            return item.name + " x " + item.quantity;
        }).join(", "),
        total: total,
        phone: phone,
        address: door + ", " + area + " - " + pincode,
        instructions: instructions,
        payment: payment
    });

    alert("Order placed successfully!\nTotal: ₹" + total);

    cart = [];
    showCart();
    showOrders();

    document.getElementById("phone").value = "";
    document.getElementById("door").value = "";
    document.getElementById("area").value = "";
    document.getElementById("pincode").value = "";
    document.getElementById("instructions").value = "";
}

function showOrders() {
    var list = document.getElementById("orders");

    list.innerHTML = "<h2>My Orders</h2>";

    if (orders.length === 0) {
        list.innerHTML += "<p>No orders yet.</p>";
        return;
    }

    orders.forEach(function(order, index) {
        var box = document.createElement("div");
        box.className = "cart";

        var title = document.createElement("h3");
        title.textContent = "Order " + (index + 1);

        var details = document.createElement("p");
        details.textContent = "Food: " + order.items;

        var total = document.createElement("p");
        total.textContent = "Total: ₹" + order.total;

        var phone = document.createElement("p");
        phone.textContent = "Mobile: " + order.phone;

        var address = document.createElement("p");
        address.textContent = "Address: " + order.address;

        var payment = document.createElement("p");
        payment.textContent = "Payment: " + order.payment;

        var instructions = document.createElement("p");
        instructions.textContent =
            "Instructions: " + (order.instructions || "None");

        var status = document.createElement("p");
        status.textContent = "Status: Order Placed";

        box.append(
            title, details, total, phone,
            address, payment, instructions, status
        );

        list.appendChild(box);
    });
}
</script>

</body>
</html>
